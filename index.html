<!DOCTYPE html> 
<html>
    <head><link rel="stylesheet" href="style.css"> 

    <title>My Library</title>
    </head>
<body>
    <nav>
    <ul>
        <li><a href="index.html">My Books</a></li>
        <li><a href="log.html">Reading Log</a></li>
        <li><a href="#">TBR</a></li>
       </ul>
    </nav>
    <div id="header">
        <div id="greeting">Welcome back</div>
        <blockquote id="quote">Somebody once told me</blockquote>
        <div id="quote-author">- Author</div>
    </div>
    <div class="my-shelf" id="main-shelf">
    </div>

    <div id="dashboard">
        <div class="currently-reading">
            <h3>Currently Reading</h3>
            <img src="six-of-crows.jpg">
            <div class="current-read-details">
                <p id="current-title">Book Title</p>
                <p id="current-author">Book Author</p>
                <div id="progress-fill"></div>
                <span id="progress-pages">Page x of x</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="number" id="current-page-input" min="0" style="width: 55px; padding: 2px 4px; text-align: center;">
                <button id="update-progress-btn" style="padding: 2px 8px; cursor: pointer; background: var(--accent-color); border: none; color: white; border-radius: 4px; font-size: 0.8rem;">Log</button>
            </div>
                        <div class="carousel-controls" style="display: flex; gap: 8px;">
            <button id="prev-read-btn" style="cursor: pointer; background: transparent; border: none; color: #e0d0b6;">◄</button>
            <span id="current-read-index" style="font-size: 0.8rem; opacity: 0.8;">1 / 1</span>
            <button id="next-read-btn" style="cursor: pointer; background: transparent; border: none; color: #e0d0b6;">►</button>
            </div>
        </div>

        <div class="progress-tracker">
            <h3>2026 Reading Goal</h3>
            <div id="goal-stats">
                <div class="progress-circle">
                </div>
                <span id="books-read">12</span><span id="books-goal">50</span>
               
            </div>
        </div>
    </div>
     <span>✮ Favourites</span>
    <div class="my-shelf" id="favourites-shelf">
        <div id="add-book-favourites" class="add-book">
            <span>+</span>
        </div>
    </div>

    
    <div id="add-book-modal" class="modal">
         <span id="add-book-close" class="closeBtn">X</span>
        <h3>Add Book</h3>
         <input type="text" id="add-book-title" placeholder="Book Title" required>
        <button id="add-to-shelf" type="submit">Add to Shelf</button>
    </div>
    <button id="create-shelf-btn">Create New Shelf</button>
    <div id="shelf-modal" class="modal">
        <span id="shelf-close" class="closeBtn">X</span>
        <h3>Create New Shelf</h3>
        <input type="text" id="new-shelf-name" placeholder="shelf name..." required>
        <button id="confirm-shelf" class="submit-btn">Create Shelf</button>
    </div>
    <br>
        <span style="font-style: italic; font-size: 1.2rem;"> 𖤘 Corner of Frozen Bookmarks</span>
    <div class="my-shelf" id="dnf-shelf" style="opacity: 0.65; filter: sepia(0.8);">
        </div>
    </div>
    <div class="modal" id="review-modal">
        <span id="review-close" class="closeBtn">X</span>
        <div class="book-cover"><img id="review-cover-img" src=""></div>
        <div class="book-metadata">
        <h2 id="review-title">Book Title</h2>
        <h3 id="review-author">Author</h3>
        <h3 id="review-genre">Genre</h3>
        <h3 id="review-pages">Pages</h3>

        <div class="status-tag">
            <label for="review-status">Status:</label>
        <select id="review-status">
            <option value="tbr">📖 To Be Read (TBR)</option>
            <option value="reading">⏳ Currently Reading</option>
            <option value="read">✅ Read</option>
            <option value="dnf"> 🛑 DNF</option>
        </select>
        </div>
        </div>
        <div class="date-row">
        <div>
        <label id="review-start">Start date:</label>
        <input type="date" id="review-start-date">
        </div>
        <div>
        <label id="review-end">End date:</label>
        <input type="date"  id="review-end-date">
        </div>
        </div>

        <div class="rating-box">
        <label id="review-rating">Rating:</label>
        </div>
     
        <div class="review-box">
        <label id="review-label">Review:</label>
        <textarea id="review-text" placeholder="your review..."></textarea>
        </div>

        <div class="quotes-box">
        <label id="quotes-label">Quotes:</label>
        <textarea id="review-quotes" placeholder="quotes..."></textarea>
        </div>
        
        <div id="tropes-container">
        <div id="selected-tropes-tags"></div>
    <div class="tropes-menu">
    <p style="font-size: 12px; margin-bottom: 5px; opacity: 0.8;">Tropes:</p>
    <div id="tropes-options-container">
    </div>
        </div>
        <div class="add-trope-wrapper">
            <input type="text" id="new-trope-input" placeholder="Add trope...">
            <button id="add-trope-btn">+</button>
        </div>
    </div>
        <button class="submit-btn" id="save-review-btn">Save Review</button>
    </div>
            <script src="script.js"></script>
</body>
</html>
